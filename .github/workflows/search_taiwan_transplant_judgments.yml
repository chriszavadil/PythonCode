name: Search Taiwan transplant-brokerage judgments

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "organ_audit/taiwan_court_corpus/search_judgments.py"
      - "organ_audit/taiwan_court_corpus/refine_by_proximity.py"
      - ".github/workflows/search_taiwan_transplant_judgments.yml"

permissions:
  contents: write

concurrency:
  group: taiwan-transplant-judgment-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Search and score public judgments
        run: python organ_audit/taiwan_court_corpus/search_judgments.py

      - name: Refine candidates by local co-occurrence
        run: python organ_audit/taiwan_court_corpus/refine_by_proximity.py

      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/taiwan_court_corpus/output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Add proximity-refined Taiwan judgment leads"
            git push
          fi
