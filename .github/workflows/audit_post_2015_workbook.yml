name: Audit post-2015 workbook structure

on:
  push:
    branches: [master]
    paths:
      - "organ_audit/audit_workbook_structure.py"
      - "organ_audit/output/post_2015_examination.xlsx"
      - ".github/workflows/audit_post_2015_workbook.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook dependency
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Inspect workbook structure
        run: python organ_audit/audit_workbook_structure.py

      - name: Commit workbook audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/analysis/workbook_structure.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Audit post-2015 workbook structure"
            git push
          fi
