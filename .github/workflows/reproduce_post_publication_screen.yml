name: Reproduce post-publication transplant screen

on:
  push:
    branches: [master]
    paths:
      - "organ_audit/reproduce_post_publication_screen.py"
      - ".github/workflows/reproduce_post_publication_screen.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependency
        run: python -m pip install --disable-pip-version-check pandas

      - name: Reproduce public screen
        run: python organ_audit/reproduce_post_publication_screen.py

      - name: Commit reproducible summaries
        run: |
          rm -f organ_audit/post_pub_screen/full_reference_data_nocode.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/post_pub_screen
          if git diff --cached --quiet; then
            echo "No screen changes"
          else
            git commit -m "Reproduce post-publication transplant screen"
            git push
          fi
