name: Analyze post-2015 transplant candidates

on:
  push:
    branches: [master]
    paths:
      - "organ_audit/analyze_post_2015_candidates.py"
      - "organ_audit/output/01_Sheet1.csv"
      - ".github/workflows/analyze_post_2015_candidates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check pandas

      - name: Analyze candidate passages
        run: python organ_audit/analyze_post_2015_candidates.py

      - name: Commit analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/analysis
          if git diff --cached --quiet; then
            echo "No analysis changes"
          else
            git commit -m "Analyze post-2015 transplant candidate passages"
            git push
          fi
