name: Inspect Taiwan judgment tables

on:
  push:
    branches: [master]
    paths:
      - "organ_audit/taiwan_brokerage/inspect_judgment_tables.py"
      - ".github/workflows/inspect_taiwan_judgment_tables.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas lxml
      - run: python organ_audit/taiwan_brokerage/inspect_judgment_tables.py
      - name: Commit privacy-safe table structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/taiwan_brokerage/debug
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Add Taiwan judgment table structure audit"
            git push
          fi
