name: Extract Taiwan organ-brokerage ledger

on:
  push:
    branches: [master]
    paths:
      - "organ_audit/taiwan_brokerage/extract_judgment_ledger_v2.py"
      - ".github/workflows/extract_taiwan_brokerage_ledger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas lxml
      - name: Fetch judgment and build validated deidentified ledger
        run: python organ_audit/taiwan_brokerage/extract_judgment_ledger_v2.py
      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/taiwan_brokerage/output_v2
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Add validated Taiwan brokerage judgment ledger"
            git push
          fi
