name: Extract Taiwan organ-brokerage ledger

on:
  push:
    branches: [master]
    paths:
      - "organ_audit/taiwan_brokerage/extract_judgment_ledger.py"
      - ".github/workflows/extract_taiwan_brokerage_ledger.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pandas lxml
      - name: Patch pandas HTML input compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("organ_audit/taiwan_brokerage/extract_judgment_ledger.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("from pathlib import Path\n", "from pathlib import Path\nfrom io import StringIO\n")
          text = text.replace('pd.read_html(html, flavor="lxml")', 'pd.read_html(StringIO(html), flavor="lxml")')
          path.write_text(text, encoding="utf-8")
          PY
      - name: Fetch judgment and build deidentified ledger
        run: python organ_audit/taiwan_brokerage/extract_judgment_ledger.py
      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/taiwan_brokerage/output
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Add deidentified Taiwan brokerage judgment ledger"
            git push
          fi
