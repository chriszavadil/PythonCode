name: Collect public organ-transport traces

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'organ_audit/transport_trace/collect_transport_traces.py'
      - '.github/workflows/collect_organ_transport_traces.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade requests beautifulsoup4
      - name: Collect public traces
        run: python organ_audit/transport_trace/collect_transport_traces.py
      - name: Commit reproducible outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/transport_trace/output
          git diff --cached --quiet || git commit -m "Update public organ-transport trace dataset"
          git push
