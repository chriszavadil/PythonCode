name: Extract Taiwan brokerage appeal reasoning

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "organ_audit/taiwan_court_corpus/extract_appeal_reasoning.py"
      - ".github/workflows/extract_taiwan_brokerage_appeal_reasoning.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python organ_audit/taiwan_court_corpus/extract_appeal_reasoning.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/taiwan_court_corpus/focused_appeal
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Add sentence-level reasoning from 2026 brokerage appeal"
            git push
          fi
