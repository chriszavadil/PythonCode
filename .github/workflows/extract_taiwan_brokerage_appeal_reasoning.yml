name: Extract Taiwan brokerage appeal reasoning

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "organ_audit/taiwan_court_corpus/extract_appeal_reasoning.py"
      - ".github/workflows/extract_taiwan_brokerage_appeal_reasoning.yml"

permissions:
  contents: write

concurrency:
  group: extract-taiwan-brokerage-appeal-reasoning
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python organ_audit/taiwan_court_corpus/extract_appeal_reasoning.py
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add organ_audit/taiwan_court_corpus/focused_appeal
          if git diff --cached --quiet; then
            echo "No output changes"
            exit 0
          fi
          git commit -m "Add sentence-level reasoning from 2026 brokerage appeal"
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
